<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — PhilaVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="error-page-body">

  <div class="error-page">
    <!-- Corner Actions -->
    <div class="corner-actions">
      <button class="icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="icon-btn" onclick="toggleRTL()" aria-label="Toggle RTL">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </button>
    </div>

    <div class="error-content">
      <!-- Logo -->
      <a href="index.html" style="display:inline-flex;align-items:center;gap:10px;font-family:var(--font-heading);font-size:1.3rem;font-weight:700;color:var(--primary);margin-bottom:48px;text-decoration:none;">
        <div class="logo-icon" style="width:36px;height:36px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="1"/>
            <path d="M7 7h.01M17 7h.01M7 17h.01M17 17h.01"/>
            <rect x="7" y="7" width="10" height="10" rx="0.5"/>
            <circle cx="12" cy="12" r="2.5"/>
          </svg>
        </div>
        <span>PhilaVault</span>
      </a>

      <div class="error-code">404</div>

      <div class="error-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="1"/>
          <path d="M7 7h.01M17 7h.01M7 17h.01M17 17h.01"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
        </svg>
      </div>

      <h1>Page Not Found</h1>
      <p>The stamp you're looking for seems to have been lost in transit. Perhaps it was missorted, or the postmark has faded beyond recognition.</p>

      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">Return Home</a>
        <a href="contact.html" class="btn btn-secondary">Contact Support</a>
      </div>
    </div>
  </div>

  <script src="components.js"></script>
</body>
</html>
