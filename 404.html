<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found. The stamp collection page you are looking for has been moved, archived, or does not exist.">
  <title>404 — Page Not Found | PhilaVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="fullscreen-page">

  <!-- Top Bar -->
  <div class="fullscreen-topbar">
    <a href="index.html" class="logo" aria-label="PhilaVault Home">
      <div class="logo-icon"><i class="fa-solid fa-stamp"></i></div>
      <span>PhilaVault</span>
    </a>
    <div style="display:flex;gap:0.5rem;">
      <button onclick="toggleRTL()" class="auth-toggle-btn" title="Toggle Direction">
        <span class="dir-label" style="font-size:0.6875rem;font-weight:600;">LTR</span>
      </button>
      <button onclick="toggleTheme()" class="auth-toggle-btn theme-toggle" title="Toggle Theme" aria-label="Toggle dark mode">
        <span class="theme-icon-wrap"><i class="fa-solid fa-moon"></i></span>
      </button>
    </div>
  </div>

  <!-- Content -->
  <main class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
      <div class="error-illustration">
        <!-- Spinning stamp watermark behind -->
        <svg class="stamp-spin" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="20" y="20" width="120" height="120" rx="8" stroke="var(--primary)" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
          <rect x="36" y="36" width="88" height="88" rx="4" stroke="var(--secondary)" stroke-width="3" opacity="0.5"/>
          <circle cx="80" cy="80" r="24" stroke="var(--primary)" stroke-width="3" opacity="0.4"/>
          <path d="M60 80h40M80 60v40" stroke="var(--secondary)" stroke-width="2" opacity="0.5"/>
        </svg>
        <div class="error-code">404</div>
      </div>
      <h1 class="error-subtitle">Page Not Found</h1>
      <p class="error-desc">Looks like this stamp went missing in transit! The page you're looking for has been moved, archived, or never existed.</p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary btn-lg">
          <i class="fa-solid fa-house" style="font-size:16px;margin-right:8px;"></i> Return Home
        </a>
        <a href="contact.html" class="btn btn-secondary btn-lg"><i class="fa-solid fa-envelope" style="font-size:16px;margin-right:8px;"></i> Contact Support</a>
      </div>
    </div>
  </main>

  <script src="components.js"></script>
</body>
</html>
