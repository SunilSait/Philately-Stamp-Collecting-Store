<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="This page is coming soon. Subscribe for updates on rare stamp arrivals, specialized auctions, and new collector tools from PhilaVault.">
  <title>Coming Soon — PhilaVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="fullscreen-page">

  <!-- Top Bar -->
  <div class="fullscreen-topbar">
    <a href="index.html" class="logo" aria-label="PhilaVault Home">
      <div class="logo-icon"><i class="fa-solid fa-stamp"></i></div>
      <span>PhilaVault</span>
    </a>
    <div style="display:flex;gap:0.5rem;">
      <button onclick="toggleRTL()" class="auth-toggle-btn" title="Toggle Direction">
        <span class="dir-label" style="font-size:0.6875rem;font-weight:600;">LTR</span>
      </button>
      <button onclick="toggleTheme()" class="auth-toggle-btn theme-toggle" title="Toggle Theme" aria-label="Toggle dark mode">
        <span class="theme-icon-wrap"><i class="fa-solid fa-moon"></i></span>
      </button>
    </div>
  </div>

  <!-- Content -->
  <main class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
      <!-- Decorative glow -->
      <div style="position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:min(450px, 90vw);height:min(450px, 90vw);background:radial-gradient(circle,rgba(184,134,11,0.1),transparent 65%);border-radius:50%;pointer-events:none;"></div>

      <div style="position:relative;z-index:2;">
        <div class="section-label" style="justify-content:center;margin-bottom:1rem;display:inline-flex;align-items:center;gap:6px;">
          <i class="fa-regular fa-clock" style="font-size:14px;"></i>
          Under Construction
        </div>
        <h1 style="font-size:clamp(1.85rem, 4.5vw, 2.6rem);margin-bottom:0.75rem;line-height:1.25;">Something Extraordinary is Being Curated</h1>
        <p style="color:var(--text-secondary);font-size:1rem;max-width:440px;margin:0 auto;line-height:1.7;">
          We're preparing a new collection that will redefine philatelic excellence. Be the first to know when we launch.
        </p>

        <!-- Countdown -->
        <div class="countdown-grid" id="countdown">
          <div class="countdown-card">
            <div class="countdown-val" id="cd-days">30</div>
            <div class="countdown-lbl">Days</div>
          </div>
          <div class="countdown-card">
            <div class="countdown-val" id="cd-hours">00</div>
            <div class="countdown-lbl">Hours</div>
          </div>
          <div class="countdown-card">
            <div class="countdown-val" id="cd-mins">00</div>
            <div class="countdown-lbl">Minutes</div>
          </div>
          <div class="countdown-card">
            <div class="countdown-val" id="cd-secs">00</div>
            <div class="countdown-lbl">Seconds</div>
          </div>
        </div>

        <!-- Subscribe Form -->
        <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Subscribed! We will notify you when this page launches.'); this.reset();">
          <input type="email" class="form-control" placeholder="your@email.com" required>
          <button type="submit" class="btn btn-primary" style="white-space:nowrap;">Notify Me</button>
        </form>

        <!-- Social Links -->
        <div class="coming-socials">
          <a href="#" class="coming-social-link" aria-label="Facebook">
            <i class="fa-brands fa-facebook-f"></i>
          </a>
          <a href="#" class="coming-social-link" aria-label="Twitter">
            <i class="fa-brands fa-x-twitter"></i>
          </a>
          <a href="#" class="coming-social-link" aria-label="Instagram">
            <i class="fa-brands fa-instagram"></i>
          </a>
          <a href="#" class="coming-social-link" aria-label="YouTube">
            <i class="fa-brands fa-youtube"></i>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="components.js"></script>
</body>
</html>
